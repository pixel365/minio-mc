name: Go

on:
  pull_request:
    branches:
      - master
      - develop

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Go ${{ matrix.go-version }} on ${{ matrix.os }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      # Upstream server binaries (dl.min.io) are gone, build the server from
      # the fork. develop carries the dependency fixes required to build it.
      - name: Check out MinIO server
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: pixel365/minio
          ref: develop
          path: .minio-server

      - name: Build MinIO server
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
        run: |
          go -C .minio-server build -tags kqueue -trimpath -o "$PWD/minio"
          rm -rf .minio-server

      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'windows-latest'
        run: |
          go build --ldflags="-s -w" -o %GOPATH%\bin\mc.exe
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'macos-latest'
        run: |
          go build --ldflags="-s -w" -o %GOPATH%\bin\mc
          go test -v -race --timeout 30m ./...
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        env:
          ACCESS_KEY: minioadmin
          SECRET_KEY: minioadmin
          ENABLE_HTTPS: 1
          MINIO_CI_CD: 1
          SERVER_ENDPOINT: localhost:9000
          MC_TEST_ENABLE_HTTPS: true
          MC_TEST_SKIP_INSECURE: true
          MC_TEST_SKIP_BUILD: true
        run: |
          mkdir -p ~/.minio/certs/ && cp testdata/localhost.crt ~/.minio/certs/public.crt && cp testdata/localhost.key ~/.minio/certs/private.key
          sudo cp testdata/localhost.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates
          ./minio server /tmp/test-xl/{1...4}/ & sleep 10
          make
          make test-race
          make verify
          ./functional-tests.sh
  vetchecks: # Run vet checks against one version.
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test 386
        run: GOOS=linux GOARCH=386 go test -short ./...

